stages:
  - build
  - manifest
  - release
  - clean

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

.build_template: &build_template
  image: docker:24.0.7
  stage: build
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

ldm-core-build:
  <<: *build_template
  variables:
    DOCKERFILE_PATH: ldm-core/Dockerfile

ldm-ingestion-build:
  <<: *build_template
  variables:
    DOCKERFILE_PATH: ldm-ingestion/Dockerfile

ldm-query-build:
  <<: *build_template
  variables:
    DOCKERFILE_PATH: ldm-query/Dockerfile

# Additional manifest/release/clean stages would mirror CPS pipelines.
