services:
  ldm-core:
    image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/debian:bullseye-slim
    command: /ldm/core
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - ../core/config.ini:/config.ini:ro
      - ../logs:/logs
  ldm-ingestion:
    image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/debian:bullseye-slim
    command: /ldm/ingestion
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - ldm-core
    volumes:
      - ../ingestion/config.ini:/config.ini:ro
      - ../logs:/logs
  ldm-query:
    image: code.nap.av.it.pt:5050/external-tools/misc-docker-images/debian:bullseye-slim
    command: /ldm/query
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - ldm-core
    volumes:
      - ../query/config.ini:/config.ini:ro
      - ../logs:/logs
