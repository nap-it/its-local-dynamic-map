[general]
debug = true
prometheus = true
prometheus_port = 9200

[messaging]
; backend options: fastdds | mqtt | zenoh
backend = mqtt
domain_id = 0
mqtt_host = 127.0.0.1
mqtt_port = 1883
zenoh_endpoint = tcp/127.0.0.1:7447

[locator]
station_type = 1
station_latitude = 40.634700
station_longitude = -8.660000
location_provider = static
locator_update_interval_ms = 1000
mqtt_host =
mqtt_port =
mqtt_topic =
domain_id = 0
dds_topic =

[ldm-core]
aom_radius_m = 1000
map_validity_seconds = 3600
vam_validity_seconds = 5
ingest_topic = ldm/updates
update_topic = ldm/updates
query_topic = ldm/query
response_topic = ldm/response

cpm_ingest_enable = true
cpm_topic_in = mqtt/in/cpm      ; using debug mqtt topic because CPS uses DDS for CPM in
cpm_topic_out = vanetza/out/cpm
local_station_id = 1
object_ttl_ms = 5000
sic_ttl_s = 1800
perception_region_ttl_s = 1800
cpm_sweeper_interval_ms = 1000
cpm_max_objects_per_station = 2000
cpm_max_stations = 512
