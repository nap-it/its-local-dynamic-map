version: '3.8'
services:
  ldm-core:
    build:
      context: .
      dockerfile: ldm-core/Dockerfile
    container_name: ldm-core
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - ./ldm-core/config.ini:/config.ini:ro
      - ./logs:/logs

  ldm-ingestion:
    build:
      context: .
      dockerfile: ldm-ingestion/Dockerfile
    container_name: ldm-ingestion
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - ldm-core
    volumes:
      - ./ldm-ingestion/config.ini:/config.ini:ro
      - ./logs:/logs

  ldm-query:
    build:
      context: .
      dockerfile: ldm-query/Dockerfile
    container_name: ldm-query
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - ldm-core
    volumes:
      - ./ldm-query/config.ini:/config.ini:ro
      - ./logs:/logs
