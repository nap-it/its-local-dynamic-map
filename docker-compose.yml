services:
  ingestion:
    image: code.nap.av.it.pt:5050/mobility-networks/ldm/ingestion:latest
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: ldm-ingestion
    restart: always
    network_mode: host
    ipc: host
    volumes:
      - ./ingestion/config.ini:/config.ini:ro
      - ./logs:/logs

  core:
    image: code.nap.av.it.pt:5050/mobility-networks/ldm/core:latest
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: ldm-core
    restart: always
    depends_on:
      - ingestion
    network_mode: host
    ipc: host
    volumes:
      - ./core/config.ini:/config.ini:ro
      - ./logs:/logs

  query:
    image: code.nap.av.it.pt:5050/mobility-networks/ldm/query:latest
    build:
      context: .
      dockerfile: query/Dockerfile
    container_name: ldm-query
    restart: always
    depends_on:
      - core
    network_mode: host
    ipc: host
    volumes:
      - ./query/config.ini:/config.ini:ro
      - ./logs:/logs
