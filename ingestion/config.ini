[general]
debug = true
prometheus = true
prometheus_port = 9201

[messaging]
; backend options: fastdds | mqtt | zenoh
backend = mqtt
domain_id = 9
mqtt_host = 127.0.0.1
mqtt_port = 1883
zenoh_endpoint = tcp/127.0.0.1:7447

[ingestion]
station_type = 1
station_id = 1
performance_logs = false

[mapem]
enable = true
input_topics = generation/mapem
output_topics = ldm/updates
simulate_input = true
simulation_interval_ms = 2000
file_path = /maps/it2.json

[vam]
enable = false
input_topics = generation/vam
output_topics = ldm/updates
simulate_input = false
simulation_interval_ms = 2000
file_path =
