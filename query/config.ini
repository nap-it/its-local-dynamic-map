[general]
debug = true
prometheus = true
prometheus_port = 9202

[messaging]
; backend options: fastdds | mqtt | zenoh
backend = mqtt
domain_id = 0
mqtt_host = 127.0.0.1
mqtt_port = 1883
zenoh_endpoint = tcp/127.0.0.1:7447

[query]
station_type = 1
station_id = 1
station_latitude = 40.634700
station_longitude = -8.660000
performance_logs = false
request_topic = ldm/query
response_topic = ldm/response
auto_request = true
request_interval_ms = 5000
query_type = mapem
